M4:[["如果他說了這句話，你會有什麼感覺？","探索","……我會覺得，我們其實是互相愛著的。我只是想知道，他也知道。","M5"],["你想他說一句「辛苦了」。","重複","對……只要一句，我就不會頂嘴了。","S4"],["他那個年紀的人，不會說這些的。","說教","（低下頭）……那我就一直這樣嗎。","G4"],["需要我陪你一起想想，怎麼跟他談嗎？","協助","（想了想）好啊……可是我也不知道從哪裡開始。","S4"]],
S4:[["如果有一天你們能這樣好好說話，你會是什麼心情？","探索","我會覺得……我知道他愛我，他自己也知道。","M5"],["你們明明都很在乎對方，只是不知道怎樣說出口。","反映","對……我知道他愛我，他自己也知道。","M5"],["他那個脾氣，很難改的。","說教","（沉默）……","G4"]],
G4:[["我說得太快了。你只是想要一句好好說的話，對嗎？","同理","（輕輕點頭）……對。","S4"],["你一直想跟他好好說話，只是一直沒機會。","同理","嗯……真的沒機會。","S4"],["別想太多，過幾天就好了。","安慰","……算了，說了也沒用。","END"]],
M5:[["你們都很愛對方，只是還在找一種彼此都舒服的方式。","看見","……對，就是這樣。謝謝你這樣說，我好像知道可以怎樣跟他開口了。","DONE"],["你想要的，是跟爸爸用舒服的方式，把這份愛說出來，對嗎？","看見","對。我想有一天，我們可以自然地說出來。","DONE"],["你們都是大人了，直接說出來不就好了？","說教","我也想啊，可是就是說不出口。","G5"],["他一定很愛你，只是不說。","安慰","……嗯，我知道。可是我還是想他親口說一次。","S5"]],
S5:[["你也想親口跟他說一句，對嗎？","看見","……對。我想他知道，我也愛他。","DONE"],["你們都很愛對方，只是還在找一種彼此都舒服的方式。","看見","……對，就是這樣。","DONE"],["那你直接跟他說就好了。","建議","……說得容易。","G5"]],
G5:[["我說得太輕鬆了。你們都想說，只是不知道怎麼開口。","同理","（點頭）對，就是不知道怎麼開口。","S5"],["那就別說了。","說教","……算了。","END"]]}},
{n:"媽媽的抉擇",t:"阿琪剛下班，約你喝杯咖啡。",tree:1,g:0,e:70,b:"阿琪，三十五歲，事業剛好起飛，有兩個孩子，分別是四歲和一歲。你是她的好朋友。",
Ly:["糾結要辭職陪孩子，還是請人帶孩子繼續拚事業","內疚、像被撕成兩半、很累","怎麼選都覺得自己不是夠好的媽媽","想做一個將來不後悔的決定，不再覺得自己害了他們","想放過自己：不管怎麼選，我都是愛孩子的"],
open:"我最近一直在想，要不要辭職回家帶孩子。可是公司剛好要升我職，我又不想放棄。",
N:{
M1:[["兩邊都放不下，這幾天一定很煩吧。","同理","對……我每天晚上都在列表比較，算到半夜，還是沒結論。其實我心裡很亂，也很內疚。","M2"],["你現在是怎麼考慮的？說來聽聽。","邀請","如果我辭職，可以每天陪他們。童年其實很短，而且是腦部發展的黃金期；如果請人帶，我多賺一些，他們可以上興趣班，也可以去旅行見世面。","S1"],["你可以請人幫忙帶啊，大家都這樣做。","建議","……大家都這樣做，不代表我就能放心。","G1"],["孩子還小，當然是自己帶最好。","附和","對吧……可是我也不想放棄這份工作，我努力了這麼多年。","S1"]],
S1:[["你想陪著孩子，也想給他們更多，兩邊都很重要。","反映","對……每一邊我都不想錯過。不管選哪一邊，我都覺得對不起另一邊，真的很內疚。","M2"],["那你現在心裡最放不下的是什麼？","探索","我最放不下的，是孩子的童年只有一次。可是我又怕，我不夠努力，他們就沒有更好的條件。我真的很內疚。","M2"],["孩子是最重要的，工作什麼時候都可以找。","說教","（皺眉）……說得輕鬆，現在的機會也不是天天有。","G1"]],
G1:[["對不起，我說得太快了。你慢慢說，我聽著。","邀請","（嘆了口氣）……我每天晚上都在算，可是越算越亂，其實我心裡很內疚。","M2"],["別想這麼多了，週末帶孩子去公園放鬆一下吧。","打岔","（笑了笑）……也好。","END"],["你就是想太多，船到橋頭自然直。","說教","……算了，你不明白的。","END"],["不如你跟家人商量一下？","建議","他們都說聽我的……這樣更難決定。","S1"]],
M2:[["你說很內疚，是對誰內疚呢？","探索","對孩子。每次出門，兩個孩子都哭著不讓我走，大的還一直叫我留下來陪他，我心都碎了。可是如果我辭職，家裡負擔會很重，可能就沒那麼多錢讓他們上興趣班、去旅行見識，也沒辦法為他們儲錢，以後上大學用。","M3"],["聽起來，你被拉扯得很累。","反映","對，我常常覺得自己像被撕成兩半，好像怎麼選，都不是一個夠好的媽媽。","S2"],["別內疚了，內疚也沒用。","建議","（皺眉）……我也知道沒用，但我就是控制不了。","G2"],["很多媽媽都是這樣的，過幾年孩子大了就好了。","安慰","（勉強笑了笑）……也許吧。可是孩子的童年不會等我，我好像怎麼選，都不是一個夠好的媽媽。","S2"]],
S2:[["你說怎麼選都不夠好，在你心裡，一個夠好的媽媽是什麼樣的？","探索","我覺得……好媽媽應該每天陪著孩子，不能錯過任何一刻。可是另一邊，好媽媽也應該讓孩子有更好的條件，不用為錢煩惱。我心裡有兩把聲音。","M3"],["兩邊都是為了孩子，卻哪邊都覺得不夠，真的很累。","同理","對……我心裡有兩把聲音。一把說，童年只有一次，必須陪；另一把說，不拚就沒有資源給他們。","M3"],["你可以兩邊都兼顧，做好時間管理就行。","建議","（苦笑）我試過了……結果兩邊都累。","G2"]],
G2:[["抱歉，我說得太輕鬆了。你說，我聽著。","邀請","……我真的很累。每天回家，孩子在等我，我卻累得說不出話。我常常覺得，怎麼選都不是個夠好的媽媽。","S2"],["你每天都在撐著，一定很不容易。","同理","（點頭）……對，我不敢讓人看到我這麼累。我常常覺得，怎麼選都不是個夠好的媽媽。","S2"],["你就是太追求完美了。","說教","……算了，說了你也不懂。","END"]],
M3:[["那在你心裡，最理想的情況是怎樣的？","探索","我希望……兩邊都不用放棄。可是我知道不可能。我只是希望，無論我怎麼選，將來回頭看，都不會後悔，也不用覺得自己害了他們。","M4"],["兩邊都是愛，卻要你二選一，真的不公平。","同理","對！我有時甚至有點氣，為什麼只有我要選。其實我只是想做一個將來不後悔的決定。","S3"],["你應該先想想孩子真正需要什麼。","說教","（沉默）……你以為我沒想過嗎？","G3"],["兩個孩子都這麼小，你當然捨不得。","附和","（點點頭）對……可是我也不想只因為捨不得，就做決定。我只是想做一個將來不後悔的決定。","S3"]],
S3:[["你真正想要的，是一個將來回頭看，都不會後悔的決定。","反映","對……我只是不想將來覺得自己害了他們。","M4"],["要怎樣，你將來才不會後悔呢？","探索","我只想成為一個好媽媽，不想他們因為我錯誤的決定，影響將來。我只是不想將來覺得自己害了他們。","M4"],["那你可以先試請人帶一年，看看孩子適不適應。","建議","（猶豫）……我怕孩子會跟我疏遠。","G3"]],
G3:[["對不起，我說得太快。你不是要我給答案，對嗎？","邀請","（點頭）……對。我只是想有人聽我說。我想做一個將來不後悔的決定。","S3"],["你每天都在想這個，一定很累。","同理","（點頭）……對，累得連自己想要什麼都不清楚了。我只是想做一個將來不後悔的決定。","S3"],["各有各的好，隨便選一個吧。","說教","……算了。","END"]],
M4:[["你說不想覺得自己害了他們，那你希望可以怎樣對自己？","探索","我希望……可以放過自己。不管選哪一邊，都不用一直問自己，是不是做錯了。","M5"],["你想要一個不後悔的選擇。","重複","對……還有，我只是想少責怪自己一點。我現在每天都在責怪自己。","S4"],["沒有完美的選擇，你不如別想太多了。","說教","（低下頭）……我知道沒有。","G4"],["需要我陪你一起整理一下嗎？","協助","（愣了一下）你願意聽，我已經很感激了。其實我每天都在責怪自己，我只是想少責怪自己一點。","S4"]],
S4:[["如果可以少責怪自己一點，你會想對自己說什麼？","探索","我想對自己說……不管我選哪一邊，我都已經盡力愛他們了，我可以放過自己。","M5"],["你不是要答案，你是想放過自己。","反映","對……就是這樣。我真的很想放過自己。","M5"],["不如你直接問問孩子，看看他們需要什麼。","建議","（沉默）……我也想過，可是我怕聽到答案。","G4"]],
G4:[["我說得太快了。你只是想少責怪自己一點，對嗎？","同理","（輕輕點頭）……對。我只是想少責怪自己一點。","S4"],["一個人在心裡跟自己較勁，一定很累。","同理","……對，其實最累的是自己，我每天都在責怪自己。我只是想少責怪自己一點。","S4"],["別想太多，過幾天就好了。","安慰","……算了。","END"]],
M5:[["你一直很愛孩子，也一直很用力。你其實是想放過自己，對嗎？","看見","（眼眶泛紅）……對。我想放過自己，也想相信，不管怎麼選，我都是愛他們的。","DONE"],["你想對自己說：不管怎麼選，我都是愛孩子的。","看見","……對。我真的很想這樣跟自己說。謝謝你。","DONE"],["你不要這麼大壓力，孩子會明白的。","說教","……我知道，但我還是會擔心。","G5"],["放心吧，你一定可以做好的。","安慰","……嗯，希望吧。可是我還是沒辦法放過自己。","S5"]],
S5:[["你不是不夠好，你只是太用力了。放過自己，不代表你不愛孩子。","看見","……謝謝你，我好像沒那麼害怕了。","DONE"],["你想對自己說：不管怎麼選，我都是愛孩子的。","看見","……對。我想這樣跟自己說。謝謝你。","DONE"],["你就先選一個，之後再調整吧。","建議","……說得容易。","G5"]],
G5:[["我說得太輕鬆了。你只是想放過自己，卻一直放不下。","同理","（點頭）對……","S5"],["那就別想了。","說教","……算了。","END"]]}},
{n:"不公平的老闆",t:"午飯時間，朋友阿文坐到你對面。",tree:1,g:0,e:60,b:"阿文，三十六歲，在公司六年，常常加班，大家有事都找他。新來的同事阿Ken升職了。你是他的朋友。",
Ly:["同事升職，自己默默做了六年卻沒升","失望、傷心","覺得自己好蠢，懷疑自己的價值","希望做的事被看見、被公平對待","想知道自己做的事有意義，自己是有價值的"],
open:"新來的阿Ken升職了。我在公司六年，加班加了無數晚，大家有事都找我解決，結果還是沒我的份。",
N:{
M1:[["這個結果，你一定很不好受吧。","同理","……嗯。其實我是很失望，也很傷心。我一直以為，只要做好自己的事，老闆自然會看見。","M2"],["阿Ken是怎麼升上去的？你說來聽聽。","邀請","他根本不做實事，只會向上管理，什麼功勞都搶。連發一封電郵，都要讓全世界知道。","S1"],["那你可以去問清楚原因啊。","建議","談什麼？說我加了很多班嗎？這樣說出口，好像我在邀功。","G1"],["這種升職，真的不公平！","附和","對吧！我每次看到他那樣，真的很氣。他發一封電郵，也要讓全世界知道。","S1"]],
S1:[["你默默做了這麼多，卻看著別人搶了功勞，一定很不是滋味。","反映","……嗯。其實我是很失望，也很傷心。我一直以為，只要做好自己的事，老闆自然會看見。","M2"],["看著這些，你心裡是什麼感覺？","探索","……失望吧，也很傷心。我一直以為，只要做好自己的事，老闆自然會看見。","M2"],["你別跟他計較，做好自己就行了。","說教","……我就是一直這樣做，才會變成這樣。","G1"]],
G1:[["對不起，我說得太快了。你說，我聽著。","邀請","（嘆了口氣）……其實我真的很失望，也很傷心。我一直以為，只要做好自己的事，老闆自然會看見。","M2"],["不說這些了，下班去吃點好的吧。","打岔","（笑了笑）……也好。","END"],["職場就是這樣，你要學會接受。","說教","……算了，你不明白的。","END"],["不如你轉工吧，換個地方重新開始。","建議","……我也想過，可是我在這裡六年了。而且他根本不做實事，只會搶功勞，連發一封電郵也要讓全世界知道。","S1"]],
M2:[["你說一直以為老闆會看見，是什麼時候發現不是這樣的？","探索","就是今天公佈升職的時候。我才發現，原來沒有人記得，那些加班的晚上，我替大家解決過多少事。我覺得自己好蠢。","M3"],["你很失望，也很傷心。","反映","對……那種感覺，說不出來。我覺得這幾年的努力，都白費了。","S2"],["你不能只等老闆看見，要自己去爭取。","說教","（低下頭）……我知道。可是現在才說，已經太遲了。","G2"],["你這麼優秀，下次一定輪到你。","安慰","（苦笑）……下次？我已經等了六年了。我覺得這幾年的努力，都白費了。","S2"]],
S2:[["你說覺得白費了，在你心裡，這幾年的努力代表了什麼？","探索","代表……我是個可靠的人，是有用的。可是結果好像在說，我不值得被看見。我覺得自己好蠢，是不是我一直都做錯了？","M3"],["花了六年，換來這個結果，真的很傷人。","同理","對……我開始覺得自己好蠢，是不是我一直都做錯了？","M3"],["你可以把這幾年的成績整理一下，下次跟老闆談。","建議","（嘆氣）……整理出來又怎樣？他不會看的。","G2"]],
G2:[["對不起，我說得太快了。你說，我聽著。","邀請","……我真的覺得這幾年的努力，都白費了。","S2"],["你一直默默付出，卻沒有人看見，一定很孤單。","同理","（眼眶有點紅）……對。我覺得這幾年的努力，都白費了。","S2"],["別這麼想，升職不是唯一的價值。","說教","……算了，你不明白的。","END"]],
M3:[["你說覺得自己蠢，蠢在哪裡？","探索","蠢在……我以為只要努力，就會有人看見。我不會向上管理，也不會替自己說話，結果就被當成理所當然。我只是希望，我做的事有人看見，也可以被公平對待。","M4"],["用心做了這麼多年，卻被當成理所當然，換了誰都會很難受。","同理","……對。我常常在想，是不是我自己有問題，所以才沒有被看見。","S3"],["你一點都不蠢，別這麼說自己。","否定","（苦笑）……你說得輕鬆。","G3"],["他們才蠢，看不到你的好。","附和","（笑了笑）……也不能這樣說。可是我真的在想，是不是我自己有問題，所以才沒有被看見。","S3"]],
S3:[["你在懷疑，是不是自己哪裡不夠好，所以才沒被看見。","反映","對……我只是希望，我做的事有人看見，也可以被公平對待。","M4"],["如果有人看見了，你希望是怎樣的？","探索","我希望老闆知道，那些加班的晚上，我替大家解決過什麼。我只是希望，我做的事有人看見，也可以被公平對待。","M4"],["那你以後也學學怎樣讓人看到你的功勞吧。","建議","（苦笑）……我學不來。我也不想變成他那樣。","G3"]],
G3:[["對不起，我說得太快了。你是不是覺得，怎麼做都像是錯的？","同理","（點頭）……對。我做事，他們說我是理所當然；我邀功，我又覺得難看。是不是我自己有問題，所以才沒有被看見。","S3"],["你慢慢說，我想聽聽你怎麼想。","邀請","……我只是想不明白。是不是我自己有問題，所以才沒有被看見。","S3"],["別想太多，過幾天就好了。","安慰","……算了。","END"]],
M4:[["如果真的被看見了，你會是什麼感覺？","探索","我會覺得……這幾年的辛苦，是值得的。其實我不是一定要升職，我只是想知道，我做的事是有意義的。","M5"],["你想自己做的事被看見，也被公平對待。","重複","對……還有，我不想再做一個只會等別人發現的人。其實我只是想知道，我做的事是不是有價值。","S4"],["公司就是這樣，不要期待太多。","說教","（低下頭）……所以我才會失望。","G4"],["要不要我陪你想想，下一步可以怎麼做？","協助","（有點意外）你願意？……其實我連自己想要什麼，都不太清楚。我只是想知道，我做的事是不是有價值。","S4"]],
S4:[["你說想知道自己做的事有沒有價值，如果答案是有，你會有什麼感覺？","探索","我會鬆一口氣吧……其實我不是一定要升職，我只是想相信，我是有價值的，不用靠老闆來證明。","M5"],["你要的不只是升職，而是確認自己的價值。","反映","對……就是這樣。其實我不是一定要升職，我只是想相信，我是有價值的。","M5"],["那你可以去進修一下，讓自己更有競爭力。","建議","（沉默）……我想要的不是進修。","G4"]],
G4:[["我說得太快了。你只是希望自己做的事被看見，也被公平對待，對嗎？","同理","（輕輕點頭）……對。我只是想知道，我做的事是不是有價值。","S4"],["這麼多年一個人默默撐著，一定很累。","同理","……對，其實最累的是，我開始不確定自己的價值。我只是想知道，我做的事是不是有價值。","S4"],["別想太多，過幾天就好了。","安慰","……算了。","END"]],
M5:[["你一直很用心，也很想知道，自己是有價值的，對嗎？","看見","（眼眶泛紅）……對。我想相信，我是有價值的，不管有沒有升職。","DONE"],["你想要的，不只是升職，而是知道自己做的事有意義，對嗎？","看見","對……就是這樣。謝謝你這樣說。","DONE"],["價值不應該靠別人給你。","說教","我知道……可是我還是想要。","G5"],["你一定會有出頭的一天。","安慰","……嗯，希望吧。可是我現在只想知道，我是不是有價值。","S5"]],
S5:[["不管有沒有升職，你這六年的付出都是真的。你想相信自己是有價值的，對嗎？","看見","……對。謝謝你，我好像沒那麼蠢了。","DONE"],["你想要的，不只是升職，而是知道自己做的事有意義，對嗎？","看見","對……就是這樣。","DONE"],["你先去爭取升職，其他的之後再說。","建議","……說得容易。","G5"]],
G5:[["我說得太快了。你只是想知道，自己是不是有價值，對嗎？","同理","（點頭）對……","S5"],["那就別想了。","說教","……算了。","END"]]}},
mkh({n:"誰是好丈夫",t:"阿怡有點心事，約你出來聊聊。",e:65,b:"阿怡，四十一歲。前半生都在照顧妹妹，一直想做寄養家庭的家長。現在有兩個人追求她：阿浩年紀相近、風趣，但身體不好，情緒起起落落，也習慣用「如果沒有你，我不知道怎麼辦」去留住她，但阿怡沒有察覺；博士大她十二年，沉穩有點悶，卻很有風度，已經跟她談過怎樣成為寄養院院長，有很實際的步驟。你是她的朋友。",
Ly:["兩個人都在追求自己，不知道該怎樣選","糾結、內疚、怕停下來就欠了誰","覺得欠妹妹，不付出就不知道自己還剩下什麼","想做寄養、想有個家，也想被好好照顧一次","想相信自己不用一直付出，也值得被好好照顧"],
open:"有兩個人都在追我，我不知道該怎樣選，好煩惱。",
L:[
{h:["兩個人都追你，卻不知道怎樣選，這陣子一定很煩吧。","（嘆了口氣）……還好，我習慣了。一個是阿浩，風趣，可是身體不好，心情又起起落落；一個是博士，沉穩，有點悶，但很有風度。我很內疚，如果我不幫阿浩，不知道他是不是處理得到。","同理"],
s:["他們兩個有什麼不同？說來聽聽。","阿浩很風趣，總是逗我笑，可是他的心情起起落落，有時突然很低落，還會說，如果我不在，他不知道怎麼辦。博士很沉穩，有點悶，可是很有風度。他有很實際的計劃，連怎樣成為寄養院院長，都跟我談好了步驟：先考取資格，再申請牌照，找場地，籌經費。我很內疚，如果我不幫阿浩，不知道他是不是處理得到。","邀請"],
x:["選對你最好的那一個就好了啊。","說得容易……我選了一個，另一個怎麼辦？我很內疚。"],
d:["那就選一個你愛的人吧。","附和","（眼睛亮了一下）……愛嗎？說到這個，我上星期去聽了寄養家庭的簡介會，他們說要先上很長的課程，還要家訪……"],
f:["你說如果不幫阿浩，不知道他是不是處理得到，這份擔心是從哪裡來的？","（猶豫）……我也不知道。我好像一直都是這樣，一看到有人需要，我就停不下來。我很怕，自己停下來，就好像欠了誰。"],
f2:["兩邊你都放不下，對嗎？","（點頭）對……其實我一直都是這樣，一看到有人需要，我就停不下來。我很怕，自己停下來，就好像欠了誰。","反映"],
sx:["阿浩會不會是在情緒勒索你？","（皺眉）……你怎麼可以這樣說他？他病著，已經夠辛苦了。","否定"],
qa:["博士那邊呢？他是怎樣對你的？","他很記得我說過的每一句話。我隨口提過想做寄養，他把它寫成了成為寄養院院長的步驟，連時間表都排好了。在他身邊我很安心。可是我很內疚，如果我不幫阿浩，不知道他是不是處理得到。"],
q2:["被人這樣放在心上，你有什麼感覺？","……很安心，也有點不習慣。好像被人這樣放在心上，我反而不知道怎麼辦。我很怕，自己停下來，就好像欠了誰。"],
q3:["聽起來，博士讓你很安心。","（點頭）……對。可是我一想到阿浩，就覺得很內疚。如果我不幫他，不知道他是不是處理得到。"],
qx:["博士連步驟都幫你排好了，選他不就可以成為寄養院院長了嗎？","（猶豫）……我也想過。可是那樣，我是不是在利用他來完成我的夢想？"],
p:["寄養家庭的事，我們待會再說。你剛才說到，有兩個人在追你，你很煩惱。","（笑了一下）……對，說回來。一個是阿浩，風趣，可是身體不好，心情又起起落落；一個是博士，沉穩，有點悶，但很有風度。我很內疚，如果我不幫阿浩，不知道他是不是處理得到。","簡介會那天，你是和誰去的？","博士陪我去的。他全程拿著筆記，連問題都替我想好了。阿浩說有空會來，結果那天又不舒服……","那天你有什麼感覺？","（輕聲）……博士在身邊的時候很安心。可是我一直看手機，怕阿浩有事找我。我很內疚，如果我不幫阿浩，不知道他是不是處理得到。","S1"],
g:"（嘆了口氣）……一個是阿浩，風趣，可是身體不好，心情又起起落落；一個是博士，沉穩，有點悶，但很有風度。我很內疚，如果我不幫阿浩，不知道他是不是處理得到。"},
{h:["你說怕停下來就欠了誰，這份怕，是什麼時候開始的？","（低頭）……好像從小就有。我從小就是這樣，一看到有人需要，我就停不下來。"],
s:["一直都在照顧別人，一定很累吧。","對……我好像已經習慣了。我從小就是這樣，一看到有人需要，我就停不下來。"],
x:["你不用每次都覺得自己應該，想太多了。","（皺眉）……你不明白，那不是想太多。","否定"],
d:["你不用每次都覺得自己應該幫忙啊。","安慰","（苦笑）……我也想這樣想。說起來，我昨天煮了一大鍋湯，煮多了，不知道該送給誰……"],
f:["你說從小就是這樣，那是從什麼時候開始的？","從妹妹生病那年開始。我從小就幫忙照顧她，總覺得她是替我受的苦。我欠她的，所以我忍不住要去幫有需要的人。"],
f2:["那個從小就一直照顧別人的你，一定也累過。","（眼眶有點紅）……累，可是我不敢說。我有個妹妹，身體一直不好，我總覺得她是替我受的苦。我欠她的，所以我忍不住要去幫有需要的人。","同理"],
sx:["那你可以先停下來休息一陣子。","（搖頭）……我停不下來。"],
qa:["你說從小就是這樣，那你小時候，家裡是怎樣的？","我有個妹妹，她身體一直不好，我從小就幫忙照顧她。她現在穩定很多了，可是我每個星期還是會打電話給她，哪怕只是問一句：吃飯了嗎？我從小就是這樣，一看到有人需要，我就停不下來。"],
q2:["這句「吃飯了嗎」，你好像也很想有人對你說。","（愣了一下）……我沒想過。可是，我確實很久沒有人問我了。其實我總覺得，妹妹是替我受的苦，我欠她的，所以我忍不住要去幫有需要的人。"],
q3:["你一直關心她，這份習慣，從來沒有停過。","對……我從小就是這樣，一看到有人需要，我就停不下來。","同理"],
qx:["你妹妹已經好了，你不用再這樣了。","（沉默）……你不明白。","說教"],
p:["你說煮了一大鍋湯，我們先說回你剛才說的「停不下來」。","（笑了笑）……對，說回來。我從小就是這樣，一看到有人需要，我就停不下來。","那鍋湯你最後送給誰了？","送給鄰居了。她一個人住，我就想，她大概沒有人煮湯給她……","你自己呢，有人煮湯給你嗎？","（愣了一下）……沒有。我自己都是隨便吃的。我從小就是這樣，一看到有人需要，我就停不下來。","S2"],
g:"（輕聲）……我從小就是這樣，一看到有人需要，我就停不下來。"},
{h:["如果有一天你停下來，不再付出了，你會怎樣看自己？","（沉默了一下）……我不知道。我常常在想，如果我不再付出，我還剩下什麼。"],
s:["背著這份欠感活了這麼多年，真的很重。","對……我常常在想，如果我不再付出，我還剩下什麼。"],
x:["你妹妹的事跟你沒關係，別這樣想。","（沉默）……我知道道理，可是我心裡過不去。","否定"],
d:["你這麼善良，應該去幫更多人。","附和","（苦笑）……大家都這樣說。對了，我鄰居的小孩下個月生日，我答應了要送她一本書，還沒買……"],
f:["你說不再付出就不知道剩下什麼，那你心裡一直想做的，是什麼？","我想做寄養，因為我想付出自己有的，例如給孩子一個家，讓他們被好好對待。"],
f2:["如果有一天，你不再需要照顧誰，你會想做什麼？","我會想……做寄養。我想付出自己有的，例如給孩子一個家，讓他們被好好對待。"],
sx:["你可以先去找人談談，把這個結解開。","（沉默）……我知道，可是我不想被當成有問題。"],
qa:["那你有沒有一件，一直想做的事？","（想了想）……我想做寄養。有時在街上，見到小朋友被大人粗暴對待，或者看到虐兒的新聞，我心裡就很難受。我想付出自己有的，例如給孩子一個家，讓他們被好好對待。"],
q2:["聽起來，你想給孩子的，是一個安全的家。","（輕聲）……對。我想有個家，讓孩子被好好對待。有能力的人，總覺得應該多付出一點。"],
q3:["這些畫面，你心裡放了很久了。","對……很久了。如果我不再付出，我還剩下什麼。","同理"],
qx:["你可以先做義工，不一定要自己照顧他們。","（猶豫）……我做過義工。可是那不夠，我想要一個家。"],
p:["你說要送書給鄰居的小孩，我們先說回你剛才說的：如果不再付出，你還剩下什麼。","（笑了笑）……對，說回來。如果我不再付出，我還剩下什麼。","那個小孩喜歡什麼書？","她喜歡有動物的。我就想，如果是我的孩子，我會每晚念一個故事給他聽……","如果是你的孩子，你想跟他一起做什麼？","我想……每個週末帶他去海邊，不用趕時間。可是我又怕，我只顧著自己的夢想，是不是太自私了。如果我不再付出，我還剩下什麼。","S3"],
g:"（輕聲）……如果我不再付出，我還剩下什麼。"},
{h:["你很想給孩子一個家，那你自己呢？","（輕聲）……我？我沒想過。我習慣了先想別人，想到自己，好像有點過意不去。其實我也想有人，好好照顧我一次。"],
s:["你想做寄養，想有個家給孩子。","對……而且我想找個人，一起實現這個夢想。其實我也想有人，好好照顧我一次。","重複"],
x:["照顧孩子是長期責任，你要想清楚自己的身體和年紀。","（低下頭）……我知道。我已經四十一歲了。"],
d:["需要我陪你一起想想，你想要怎樣的伴侶嗎？","協助","（有點意外）你願意？……說起來，博士前幾天給我看了一份計劃書，連場地、經費、人手都列好了……"],
f:["你說也想有人好好照顧你，如果有這樣的人，會是什麼感覺？","我會覺得……我可以放鬆一點。我不用再一直當那個撐著的人，也有人好好照顧我。"],
f2:["你不只是想有個家給孩子，也想有個人，給你一個家。","（眼眶泛紅）……對。就是這樣。我不用再一直當那個撐著的人，也想有人好好照顧我。","反映"],
sx:["那你選一個條件好的，先穩定下來再說。","（猶豫）……可是那樣，我是不是在逃避我該做的事？"],
qa:["阿浩有沒有說過，他想要怎樣的將來？","他說過，他想跟我去很多地方，一起笑到老。可是他每次說完，過幾天又會突然說，他可能撐不到那個時候……其實我也想有人，好好照顧我一次。"],
q2:["他說撐不到那個時候，你聽了，心裡是什麼感覺？","（輕聲）……很害怕。我就會馬上說，我會一直在。可是說完之後，又覺得好累。我不用再一直當那個撐著的人，我也想有人好好照顧我。"],
q3:["聽起來，你很想相信他說的將來。","對……我真的很想相信。可是，其實我也想有人，好好照顧我一次。","同理"],
qx:["他這樣說，是不是想你多關心他？","（皺眉）……你不要這樣說他。他只是很害怕。","否定"],
p:["你說博士給你看計劃書，我想回到你剛才說的：你也想有人好好照顧你。","（笑了笑）……對，說回來。其實我也想有人，好好照顧我一次。","那份計劃書上，場地選在哪裡？","在大學附近，旁邊有個公園。他說，孩子放學後可以在那裡玩，我們還可以辦一個小小的功課班……","他說的時候，你想像到什麼畫面？","（輕聲）……我想像到，我坐在窗邊，有人替我倒一杯茶。其實我也想有人，好好照顧我一次。","S4"],
g:"（輕輕點頭）……其實我也想有人，好好照顧我一次。"},
{h:["你想要的，不只是幫別人，也想被好好照顧一次，對嗎？","（眼眶泛紅）……對。我一直不敢說，好像我不配。我更想知道，我值不值得被好好照顧。","看見"],
s:["你是不是想相信，你不用一直照顧別人，也值得被好好照顧？","……對。我想放下那份欠妹妹的感覺，也想相信，我值得被好好對待。我更想知道，我值不值得被好好照顧。","看見"],
x:["你不要再想著欠誰了，那是你妹妹的事。","（沉默）……我知道，可是我還是放不下。"],
d:["你一定會遇到對的人。","安慰","（笑）……希望吧。對了，我昨天又夢到一個小孩，在門口等我回家，我一開門，他就跑過來抱住我……"],
f:["你不是想自私，你只是也想被好好愛一次，對嗎？","（哽咽）……對。我好像一直不敢承認。謝謝你。"],
f2:["你一直在照顧別人，現在你也想被人照顧，這並不自私，對嗎？","……對。我想，我可以慢慢練習，讓自己也被好好對待。"],
sx:["你先選一個試試，不合適再換。","……說得容易。"],
p:["說到那個夢，你剛才說，你更想知道，你值不值得被好好照顧。","（點頭）……對。我更想知道，我值不值得被好好照顧。","那個夢裡的小孩，長得像誰？","（笑了）……像我小時候。我也不知道為什麼。","小時候的你，需要什麼？","（輕聲）……需要有人抱抱我，說：你不用這麼用力。我更想知道，我值不值得被好好照顧。","S5"],
g:"（輕聲）……我更想知道，我值不值得被好好照顧。"}]}),
mk({n:"晚婚真好",t:"聚會散場後，阿敏留下來陪你走一段路。",e:60,b:"阿敏，四十歲，畢業後不久結婚，孩子十五歲和十七歲。好友阿Jo同歲，晚婚，孩子才四歲和一歲，事業也發展得好。你是另一位朋友。",
Ly:["羨慕晚婚、事業好的好友","酸、不甘心，又覺得自己不該這樣想","覺得自己像井底之蛙，懷疑當年太早結婚","想做回自己的事、賺自己的錢、去看看世界","想相信自己現在開始也不晚，自己不只是媽媽"],
open:"阿Jo先把事業做起來，晚一點才結婚，孩子才四歲和一歲。我們同年，她看起來比我輕鬆多了。",
L:[
{f:["看著她那樣，你心裡大概有點不是滋味吧。","……也不是不滿意現在。只是看到她，心裡有點酸，有點不甘心，然後又覺得自己不該這樣想。"],
s:["你覺得她哪裡讓你羨慕？","她可以先拚事業，到處去，見識很多，也有選擇。我一畢業就結婚了。……心裡有點酸，有點不甘心，然後又覺得自己不該這樣想。"],
x:["你有家庭，有孩子，別不知足。","……我知道，我也沒說這樣不好。"],
d:["人都會羨慕別人，很正常。","安慰","是啊，很正常……只是我心裡有點酸，有點不甘心，然後又覺得自己不該這樣想。"],
f2:["你有點羨慕，也有點不甘心，又覺得不該這樣。","對……就是這樣。有點酸，有點不甘心，然後又覺得自己不該這樣想。","反映"],
sx:["你也可以出去走走啊。","（苦笑）孩子要考試了，哪走得開。"],
g:"……其實有點酸，有點不甘心。我自己都不願意承認，然後又覺得自己不該這樣想。"},
{f:["那你自己怎麼看這件事？","我覺得……我像一隻井底之蛙。她見過那麼多地方，賺得比我多，我一畢業就結婚，什麼都沒看過。而且這些年磕磕絆絆，我有時會想，要是當年多等幾年，會不會遇到更適合的人。"],
s:["羨慕她，又覺得自己不該，心裡一定很矛盾。","對……而且我以前不是這麼想的，是這幾年孩子大了，空下來才開始想。空下來的時候，我就覺得自己像一隻井底之蛙。"],
x:["每個人選擇不同，你現在也很好啊。","……對啊，我現在也很好。（語氣平淡）","安慰"],
d:["我也有過羨慕別人的時候。","同理","是嗎？……你也會這樣？其實空下來的時候，我就覺得自己像一隻井底之蛙。"],
f2:["你說空下來才開始想，空下來的時候，你都在想什麼？","我覺得……我像一隻井底之蛙。她見過那麼多地方，賺得比我多，我一畢業就結婚，什麼都沒看過。而且這些年磕磕絆絆，我有時會想，要是當年多等幾年，會不會遇到更適合的人。"],
sx:["孩子大了，你可以輕鬆點了啊。","……輕鬆？"],
g:"……那些空下來的時間，我才發現，我好像什麼都沒有。我覺得自己像一隻井底之蛙。"},
{f:["如果可以重新來，你最想為自己做什麼？","我想……做回自己的事，賺自己的錢，去看看世界。不只是誰的太太、誰的媽媽。"],
s:["一直待在原位，看著別人走遠，真的很不甘心。","對！而且還要被說我命好、老公好，我說不出口。我常常想，要是當年多等幾年，我是不是就能遇到更適合的人。"],
x:["沒有如果了，孩子都這麼大了。","……是啊，我知道。（低落）","否定"],
d:["晚婚不一定就更幸福，你看有些人也不順。","安慰","也許吧。可是她選的時候，是知道自己要什麼的。我常常想，要是當年多等幾年，我是不是就能遇到更適合的人。"],
f2:["你說多等幾年會更適合，那你現在最想要的是什麼？","我想……做回自己的事，賺自己的錢，去看看世界。不只是誰的太太、誰的媽媽。"],
sx:["你現在才開始也不晚，快去試試吧。","（猶豫）說得容易……我都四十歲了。"],
g:"……我四十歲了，覺得好像什麼都來不及。要是當年多等幾年，我是不是就能遇到更適合的人。"},
{f:["如果真的做回自己的事，你會有什麼感覺？","……我會覺得，我是個有用的人，不是只是在這個家裡等孩子長大。其實我只是想知道，我現在開始也不晚。"],
s:["你想做回自己，不只是太太和媽媽。","對……我不想一輩子只這樣。其實我只是想知道，我現在開始，是不是也不晚。","重複"],
x:["孩子還沒考完，先把他們照顧好吧。","……我知道。我一直都是這樣做的。"],
d:["需要我幫你想想，可以從哪裡開始嗎？","協助","（有點意外）你真的願意聽？……我連該從哪裡開始都不知道。我只是想知道，我現在開始，是不是也不晚。"],
f2:["你想被看見的，是你自己也有能力，對嗎？","對……不是為了比誰，我只是想知道，我現在開始也不晚。","反映"],
sx:["你這個年紀，要重新來很難了。","……（沉默）","說教"],
g:"（眼眶泛紅）……我只是想知道，我現在開始，是不是也不晚。"},
{f:["你一直都有自己，只是太久沒有人看見。現在開始，一點也不晚。","……謝謝你。我好像可以輕鬆一點地面對這件事了。"],
x:["你現在是媽媽，這就是最重要的角色了。","……我知道，但我也想要別的。"],
d:["你已經很棒了，孩子以後會感謝你的。","安慰","……嗯。可是我也想自己感謝自己。"],
f2:["你想被看見的，是你自己，不只是媽媽和太太的身分，對嗎？","對……就是這樣。"],
sx:["你現在這樣不是很好嗎？","……算了。","否定"],
g:"（點頭）……我不只是個媽媽，我也想做回自己。"}]}),
mk({n:"工程師的最後一個項目",t:"週末，朋友阿華約你吃午飯。",e:60,b:"阿華，五十五歲，工程師，單身。最近見媽媽老了很多，朋友的媽媽又忽然走了，連道別都來不及，所以他認真考慮要不要提早退休。你是他的朋友。",
Ly:["要不要提早退休","不安：怕來不及道別，也怕老了身邊沒有人","能把退休金估得很準，卻估不準一個人老了怎麼過","想多陪媽媽留下回憶，也想老了身邊有個人","想有人陪伴終老，決定先陪媽媽走這一段"],
open:"最近我見媽媽，覺得她老了很多。上星期，我朋友的媽媽忽然走了，連道別都來不及。我開始認真想，要不要提早退休。可是如果提早退休，我身體好的話，可以捱到七十歲，生活質素卻一定會下降。這筆賬，我怎麼也對不上。",
L:[
{f:["見到媽媽老了，朋友的媽媽又忽然走了，這陣子你心裡一定不好受。","（點頭）……是啊。我一想到，如果連道別的機會都沒有，我就很不安。可是退休這筆賬，我怎麼也對不上。"],
s:["你說對不上，是哪裡對不上？說來聽聽。","如果我身體好，退休金勉強夠生活，只是以後什麼都要省，生活質素一定下降。不退休呢，我又怕媽媽的日子越來越少。……我一想到，如果連道別的機會都沒有，我就很不安。可是退休這筆賬，我怎麼也對不上。"],
x:["你找個專業的人幫你看看吧。","（搖頭）……我自己是做工程的，風險和容錯，我比誰都清楚。","建議"],
d:["你媽媽現在不是還好嗎？不用想這麼多。","安慰","（沉默）……我朋友的媽媽，上個月也是還好的。我一想到，如果連道別的機會都沒有，我就很不安。"],
f2:["你不是在煩惱錢，而是怕來不及。","對……就是這樣。我一想到，如果連道別的機會都沒有，我就很不安。可是退休這筆賬，我怎麼也對不上。","反映"],
sx:["那你先放個長假，多陪媽媽一陣子。","（猶豫）……放假和退休不一樣。退了，就回不去了。"],
g:"（沉默一下）……我一想到，如果連道別的機會都沒有，我就很不安。可是退休這筆賬，我怎麼也對不上。"},
{f:["你說很不安，這份不安，是在哪些時候最明顯？","最明顯是……晚上我一個人在家。如果身體好，我的退休金都勉強夠生活。但健康的事沒有人說得準，如果萬一有什麼病，生活就會很困難，身邊又沒有人。我怕媽媽的日子，和我自己的後路，兩邊都來不及。"],
s:["一邊是媽媽，一邊是自己的將來，真的很難放下哪一邊。","對……我常常覺得，無論選哪邊，都會有一邊來不及。"],
x:["你媽媽現在身體不是還好嗎？你想太多了。","（沉默）……我朋友的媽媽，也是前一天還好好的。","否定"],
d:["你一向都很理性，一定會做出對的決定。","安慰","（苦笑）……理性。我就是太理性了，才怎麼想都覺得，這個決定沒有一個完美的方案。無論選哪邊，都會有一邊來不及。"],
f2:["你說怕來不及，來不及的時候，你會想到什麼？","我會想到……媽媽走了以後，我一個人。我連可以一起回憶的人，都沒有了。以後我老了，萬一有什麼病，也是一個人。我怕兩邊都來不及。"],
sx:["你找些朋友多聚聚，就不會那麼孤單了。","（淡淡一笑）……朋友都有自己的家庭。"],
g:"（輕聲）……無論選哪邊，都會有一邊來不及。萬一有什麼病，身邊又沒有人。"},
{f:["你說到以後一個人，你心裡會怎樣看待這件事？","我覺得……我這輩子都在做對的決定，做好規劃。可是我能把退休金估得很準，卻估不準，一個人老了要怎麼過。不管選哪邊，後果都只有我自己扛。我其實很想，多留下一些可以記一輩子的回憶，也想老的時候，身邊有個人。"],
s:["一直把一切規劃好，卻還是覺得不踏實，一定很無奈。","對……我常常想，我能把退休金估得很準，卻估不準，一個人老了要怎麼過。"],
x:["你有媽媽，還有朋友，怎麼會什麼都沒有？","（搖頭）……他們不會一直在。","否定"],
d:["你一個人也有好處，自由自在，不用擔心別人。","附和","（苦笑）……自由。可是我常常想，我能把退休金估得很準，卻估不準，一個人老了要怎麼過。"],
f2:["如果不用考慮這些，你最想把時間花在哪裡？","我想……多陪媽媽，帶她去她想去的地方，拍很多照片，留下可以記一輩子的回憶。也想老的時候，身邊有個人。"],
sx:["你可以先放一段長假，再決定。","（沉默）……我也想過。可是放完假之後，我還是要面對同一個問題。"],
g:"（輕聲）……我能把退休金估得很準，卻估不準，一個人老了要怎麼過。"},
{f:["如果真的有這些回憶，也有個人在身邊，你會是什麼感覺？","我會覺得……這一生沒有白過。其實我一直不敢承認，我想找個人，一起把日子過下去。可是我又怕，到了這個年紀，沒有人願意。"],
s:["你想多陪媽媽，也想老了有個人在身邊。","對……兩樣我都想要。其實我只是想找個人，一起把日子過下去。","重複"],
x:["錢也很重要，你要為自己的老年著想。","（低下頭）……我知道。所以我才想了這麼久。"],
d:["需要我陪你一起想想嗎？隨便聊聊就好。","協助","（有點意外）你願意？……其實我只是想找個人，一起把日子過下去。"],
f2:["你不只是想陪媽媽，也想老的時候，有人陪你。","對……就是這樣。我這輩子都在做規劃，卻忘了問，我想不想一個人老去。","反映"],
sx:["你可以多認識些人，找個伴。","（淡淡一笑）……五十五歲，哪有這麼容易。"],
g:"（輕輕點頭）……我只是想找個人，一起把日子過下去。我想不想一個人老去。"},
{f:["你想要的，是有個人陪你走到最後，對嗎？","（眼眶泛紅）……對。我一直不敢說。我想，我是時候找個人，一起終老了。至於退休的事，我想，我會先陪媽媽走這一段。"],
x:["你不要再想這些了，順著心走就好。","（沉默）……說得容易，我已經習慣了。"],
d:["一定會有人願意的。","安慰","……嗯，希望吧。可是我更想知道，有沒有人願意陪我走到最後。"],
f2:["你一直用規劃去照顧身邊的人，其實你也值得有人陪你，對嗎？","……對。我不太會說，只會做規劃。可是我想，我也值得有人一起終老。"],
sx:["那你先決定了，再慢慢調整。","……說得容易。"],
g:"（輕聲）……我更想知道，有沒有人願意陪我走到最後。"}]}),
mk({n:"月底的數字",t:"月底，同事阿成約你下班後喝一杯。",e:65,b:"阿成，已婚，前線銷售。收入很好，但每個月都有很大壓力，最近業績不理想。公司問他要不要轉去後勤。你是他的同事。",
Ly:["要不要轉去後勤","壓力大、怕追不到、丟臉和害怕","覺得業績不好就是失敗，收入少了就不知道自己算什麼","想保住收入，也想睡得安穩、有時間陪太太","想知道自己不靠業績，也值得被需要、仍是好丈夫"],
open:"公司問我，要不要轉去後勤。壓力會小很多，不過沒有分紅，薪水少一截，加班又更長。我已經想了很久，還是不知道怎樣選。",
L:[
{f:["這陣子你一定很掙扎吧。","（苦笑）……每個月底看數字，我都心跳加速。想轉後勤，又覺得好像認輸。"],
s:["這份工作，這幾個月是怎樣的？","業績追不上，每個月都被上面「關心」，每次開會我都不敢抬頭。……每個月底看數字，我都心跳加速。想轉後勤，又覺得好像認輸。"],
x:["後勤也不錯啊，穩定一點，不用這麼累。","（皺眉）……穩定？薪水少一截，還要加班更久。","建議"],
d:["你們老闆太苛刻了，這樣追業績誰受得了。","附和","對吧！他們只看數字，不看人。……每個月底看數字，我都心跳加速。想轉後勤，又覺得好像認輸。"],
f2:["你一邊想喘口氣，一邊又覺得轉去後勤就是認輸。","對……就是這樣。每個月底看數字，我都心跳加速。想轉後勤，又覺得好像認輸。","反映"],
sx:["你有跟家人說過這件事嗎？","（沉默）……我還沒跟她說。她已經夠擔心了。"],
g:"（嘆了口氣）……每個月底看數字，我都心跳加速。想轉後勤，又覺得好像認輸。"},
{f:["你說覺得好像認輸，這個「輸」，是輸給誰？","……輸給我自己吧。我以前都是頂尖的。現在每個月被「關心」，我覺得很丟臉，也很害怕。"],
s:["每個月都這樣繃緊，真的很累。","對……有時候半夜醒來，還在算數字。我很怕，下個月又追不到。"],
x:["壓力人人都有，你要學會調整心態。","（低下頭）……我知道。可是這不是調整就能解決的。"],
d:["你這麼拼，一定沒問題的。","安慰","（苦笑）……以前我也這樣想。可是我很怕，下個月又追不到。"],
f2:["你說很怕追不到，追不到的時候，你會想到什麼？","我會想到……我是不是不行了。我以前都是頂尖的，現在每個月被「關心」，我覺得很丟臉，也很害怕。"],
sx:["你可以跟公司談談，調整一下目標。","（搖頭）……談了又怎樣，他們只看數字。"],
g:"（輕聲）……我很怕，下個月又追不到。"},
{f:["你覺得，業績不好，代表了什麼？","代表……我是個失敗的男人。男人要養家，收入少了，就是不夠本事。轉去後勤，就像承認自己輸了。我不想讓太太和家人失望。可是我也很想，可以睡一個安穩覺，不用每天都像打仗。"],
s:["以前是頂尖，現在卻要被「關心」，心裡一定很不是滋味。","對……而且我是家裡的經濟支柱。我常常想，如果收入少了，我還算什麼。"],
x:["業績好不好，跟你的價值沒關係。","（苦笑）……你說得輕鬆。","否定"],
d:["這份工作本來就是這樣，不是你的問題。","附和","也許吧……可是我常常想，如果收入少了，我還算什麼。"],
f2:["如果收入少了一些，你最擔心的是什麼？","我擔心……太太會失望，家裡的生活會變差。可是我也很想，可以睡一個安穩覺，不用每天都像打仗。"],
sx:["你和家人可以一起分擔，不是嗎？","（猶豫）……我不想讓太太覺得，我扛不起這個家。"],
g:"（輕聲）……如果收入少了，我還算什麼。"},
{f:["如果可以睡一個安穩覺，你會是什麼感覺？","我會覺得……我終於可以喘一口氣。其實我不只想賺錢，我也想有時間，陪陪太太，好好吃一頓飯。"],
s:["你想保住收入，也想睡得安穩。","對……我兩個都想要。其實我只是想知道，我不靠業績，還值不值得被需要。","重複"],
x:["家裡最重要，錢夠用就行了。","（低下頭）……你說得容易，房貸還在呢。"],
d:["需要我陪你一起把兩個選擇的好處壞處寫下來嗎？","協助","（有點意外）你願意？……其實我只是想知道，我不靠業績，還值不值得被需要。"],
f2:["你要的不只是工作，而是不靠業績，也有人需要你。","對……就是這樣。我不靠業績，還值不值得被需要。","反映"],
sx:["你轉去後勤吧，先睡個安穩覺。","（猶豫）……可是這樣，我是不是在逃避？"],
g:"（輕輕點頭）……我只是想知道，我不靠業績，還值不值得被需要。"},
{f:["你想知道，就算沒有業績，你還是被需要的，對嗎？","（眼眶泛紅）……對。我想相信，我就算賺少一點，還是太太眼中的好丈夫。"],
x:["你不用靠業績證明自己，這些都是虛的。","（沉默）……我知道。可是我還是需要。"],
d:["你太太一定會明白你的。","安慰","……嗯，希望吧。可是我更想知道，我不靠業績，還值不值得被需要。"],
f2:["你一直為這個家拼命，其實是因為你很愛他們，對嗎？","……對。我只是不太會說，只會用錢去表達。"],
sx:["你直接跟她說吧。","……說得容易。"],
g:"（輕聲）……我更想知道，我不靠業績，還值不值得被需要。"}]}),
mkh({n:"老友記的大計",t:"長者中心的下午，黃伯拉你坐到他旁邊。",e:55,b:"黃伯，七十多歲，在長者中心向老友記說起他身後事的「大計」，想海上撒灰。說話會繞、愛說舊事。你是他的老友記。",
Ly:["向老友記說起海上撒灰","心疼、過意不去、怕成為負擔","怕子女為難、被人指指點點，覺得走得乾淨一點最輕鬆","想自由自在到處去，也想他們記得自己","想被他們記得，想他們想起自己時是想念，不是責任"],
open:"我跟你們說，我走了之後，不用拜山，也不用買墓，找個日子，把我撒到海裡就好。省得子女麻煩。",
L:[
{h:["你想了很久，才下了這個決定吧。","（點頭）……是啊。我不想子女麻煩。他們平時已經夠忙了，清明重陽還要塞車去拜，我看著都累。","同理"],
s:["你怎麼會想到海上撒灰？說來聽聽。","海是通的，我可以到處去，就像一直在旅行。你們也想想，子女不去，會被說不孝；去的話，又累。……他們平時已經夠忙了，我不想他們在節日還要為我奔波。","邀請"],
x:["別說這些不吉利的話了。","（皺眉）……有什麼不吉利？早點說清楚，大家才不用麻煩。"],
d:["你說得對，我也不想給子女添麻煩。","附和","對吧！你們還記得阿福嗎？上個月他出殯，我去了，人擠人，他兒子站了三個鐘頭，腳都軟了……"],
f:["你說他們平時已經夠忙了，看著他們這樣奔波，你心裡是什麼感覺？","心疼吧……也有點過意不去。他們為我辛苦了一輩子，死後還要他們跑來跑去，我心裡不好受。我不想將來，變成他們的負擔。"],
f2:["你想的是，不要讓子女們為了拜祭而辛苦。","對……就是這樣。他們為我辛苦了一輩子，死後還要他們跑來跑去，我心裡不好受。我不想將來，變成他們的負擔。","反映"],
sx:["你應該跟子女商量一下。","（搖頭）……他們一定會說我亂講。"],
qa:["你說撒到海裡，你年輕的時候，跟大海有什麼緣分嗎？","（眼睛亮了）……我年輕的時候在船上做過工，去過新加坡、日本、澳洲。每個港口只停一天，我就站在甲板上看。……他們平時已經夠忙了，我不想他們在節日還要為我奔波。"],
q2:["站在甲板上看，那種感覺，你很想念吧？","（點頭）……想念。那時候，我覺得自己是自由的。現在年紀大了，反而覺得自己是個負擔。我不想將來，變成他們的負擔。"],
q3:["所以你想撒在海裡，是想回到那種自由。","對……就是這樣。他們平時已經夠忙了，我不想他們在節日還要為我奔波。","同理"],
qx:["那你現在也可以去那些地方看看啊，不用等到走了以後。","（苦笑）……現在？我這把年紀，腳也不好，哪裡去得了。"],
p:["你說阿福的葬禮，他兒子站了三個鐘頭。你剛才說，子女平時已經夠忙了。","（點頭）……對，所以我才說，不如省了。他們平時已經夠忙了，我不想他們在節日還要為我奔波。","阿福的兒子後來怎樣？","後來他在殯儀館門口，坐在石級上，坐了很久，沒有人敢去叫他。","你看到他那樣，心裡想到什麼？","（輕聲）……我想到我自己的兒子。我不想他們將來也那樣。他們平時已經夠忙了，我不想他們在節日還要為我奔波。","S1"],
g:"（點頭）……他們平時已經夠忙了，我不想他們在節日還要為我奔波。"},
{h:["你說不想變成負擔，是從什麼時候開始有這種想法的？","（想了想）……退休以後吧。我不想將來，變成他們的負擔。"],
s:["一輩子為子女操心，走了還怕連累他們。","對……我就是這種人。我不想將來，變成他們的負擔。"],
x:["子女拜祭是孝順，怎麼會是麻煩？","（搖頭）……你不明白，不是孝不孝的問題。","否定"],
d:["你想太多了，子女不會覺得你是負擔。","安慰","（笑了笑）……你們看，我昨天去街市，一個賣魚的小伙子，叫我伯伯，還多送我一條魚。現在的年輕人，也不都那麼忙嘛……"],
f:["如果他們知道你這樣想，你覺得他們會怎樣？","我怕……他們不去，會被人說不孝，心裡內疚；去了，又辛苦。無論怎樣，都是為難他們。所以我想，不如撒在海裡。海是通的，我可以到處去，就像一直在旅行。人言可畏，我不想他們被人指指點點，勉強自己。"],
f2:["你說怕變成負擔，是不是看著別人家的事，想到的？","（點頭）……你們還記得阿福嗎？他走了以後，他的兒女吵了一場。有人說要大辦，有人說簡單。我就想，我不想他們也這樣。我不想麻煩他們，更不想他們為我左右為難。"],
sx:["你可以多跟子女聊聊，他們會明白的。","（淡淡一笑）……他們忙，我不想打擾。"],
qa:["你平時和子女怎樣聯絡？","每個星期天，他們會來吃飯。我煮了菜，他們吃完，就看手機，我就看他們看手機。……我不想將來，變成他們的負擔。"],
q2:["他們看手機的時候，你心裡想什麼？","（輕聲）……我想，他們多坐一會兒也好。可是我又怕，說出口，就變成了纏著他們。去也不是，不去也不是，我不想他們為我這樣。"],
q3:["你很想多留他們一會兒。","（點頭）……對。可是我不想將來，變成他們的負擔。","同理"],
qx:["你自己主動找話題，不就好了？","（淡淡一笑）……我找過，他們說：爸，我們趕時間。","說教"],
p:["你說賣魚小伙子送你魚，我們先說回你剛才說的：你不想變成他們的負擔。","（笑了笑）……對，說回來。我不想將來，變成他們的負擔。","那條魚你怎麼煮的？","蒸的。我煮得好，上次我兒子說，爸，你這條魚比餐廳的還好吃。","他這樣說的時候，你是什麼感覺？","（輕聲）……我很高興，高興了一整個星期。可是我不想將來，變成他們的負擔。","S2"],
g:"（沉默一下）……我不想將來，變成他們的負擔。"},
{h:["你說不想他們為難，在你心裡，子女拜祭會是什麼樣子？","（想了想）……就是被人看著的事。去了，要做足；不去，就被說。我怕他們為了面子，勉強自己來拜我。"],
s:["兩邊都為難他們，你一定想了很久。","對……我想了好幾年。我只是不想他們為難。"],
x:["拜祭是傳統，你不要想得這麼複雜。","（皺眉）……傳統我也懂。可是現在的年輕人，沒那麼多時間了。"],
d:["現在的年輕人是辛苦，哪有時間顧這些。","附和","對吧……說起來，我孫女上個月說要去日本交換，一年。我說好，去，去，去，千萬別擔心我……"],
f:["如果走的時候，不用想著他們，你最希望自己是什麼樣子？","我想……自由自在。海是通的，我可以到處去，就像一直在旅行。我年輕的時候沒什麼機會去玩，希望走了以後，可以去很多地方。可是，有時候我又想，日子久了，我怕連名字都被淡忘了。"],
f2:["你一直在想他們，那你自己呢，想怎樣離開？","（想了想）……我想，走得乾淨，不要麻煩。可是有時候我又想，我怕他們忙著忙著，就把我放在一邊了。"],
sx:["不如找個地方安放，他們想拜就拜，不想拜就不拜。","（搖頭）……那還是要他們來啊。"],
qa:["你有沒有跟家裡人提過這個想法？","（搖頭）……沒有。孫女上個月說要去日本交換一年，我說好，去，去，千萬別擔心我。回到家，我坐在沙發上，坐了很久。……人言可畏，我不想他們被人指指點點，勉強自己。"],
q2:["你說好，去，去，回到家卻坐了很久。","（輕聲）……是啊。我不想拖著她。可是我又怕，她去了，就不會再想起我這個爺爺了。我又想，清明重陽沒有人來，我是不是就沒有人記得了。"],
q3:["你很想她留在身邊，又不想拖著她。","（點頭）……對。我不想麻煩他們，更不想他們為我左右為難。","同理"],
qx:["孫女有自己的前途，你要支持她。","（沉默）……我當然支持。","說教"],
p:["你說孫女要去日本，我們先說回拜祭。你說，不想他們為難。","（點頭）……對，說回來。去也不是，不去也不是，我不想他們為我這樣。","她去日本做什麼？","讀什麼設計吧，我也不太懂。她說，爺爺，我拍很多照片給你看。","那你想看她拍的照片嗎？","（輕聲）……想。我可以看一整天。可是我又怕，等不到她回來。我怕他們為了面子，勉強自己來拜我。","S3"],
g:"（輕聲）……我只是不想他們為難。"},
{h:["如果真的在海上，到處去，你會是什麼感覺？","（想了想）……我會覺得很自由，也很放心。可是有時我又想，我怕有一天，他們提起我，只剩下一句「那個老頭」。我只是想知道，我在他們心裡，還佔著多大一個位置。"],
s:["你想自由自在，也想他們輕鬆。","對……我兩樣都想要。我怕日子久了，連名字都被淡忘了。","重複"],
x:["我們講究入土為安，你這樣不好。","（沉默）……我知道。可是我已經想了很久。"],
d:["需要我陪你去跟子女說嗎？","協助","（有點意外）你願意？……說起來，我兒子下個月生日，我想送他一支筆，他以前寫字總是用我的……"],
f:["你說怕被他們淡忘，你希望他們想起你的時候，是怎樣的？","我希望……是想念，不是責任。我想他們想起我的時候，會笑一笑，而不是嘆一口氣。"],
f2:["你想自由，也想被他們記得。","對……就是這樣。我怕日子久了，連名字都被淡忘了。我希望他們想起我，是因為想念，不是因為責任。","反映"],
sx:["那你每年留一封信給他們，讓他們記得你。","（猶豫）……信，我寫不來。"],
qa:["你有沒有想過，用什麼方式讓他們記得你？","（想了想）……我年輕時在船上做過工，我有一箱照片，他們從來沒看過。我走了以後，他們還會不會想起我。"],
q2:["那一箱照片，你想他們看到什麼？","我想他們看到，爸爸也年輕過，也自由過。我想他們看到的，是一個活過、愛過的爸爸，不是一份責任。"],
q3:["你很想他們認識，年輕時的你。","（點頭）……對。我怕他們忙著忙著，就把我放在一邊了。","同理"],
qx:["你可以把照片放進相簿，送給他們。","（猶豫）……我怕他們不看。"],
p:["你說要送兒子一支筆，我想回到你剛才說的：你怕被他們淡忘。","（笑了笑）……對，說回來。我怕有一天，他們提起我，只剩下一句「那個老頭」。","那支筆有什麼特別？","是我第一份工資買的，用了三十年。他小時候偷偷拿去畫過牆，我打了他一頓，現在想想，也沒什麼……","你現在想起那頓打，是什麼心情？","（輕聲）……有點想笑，也有點後悔。清明重陽沒有人來，我是不是就沒有人記得了。","S4"],
g:"（輕輕點頭）……我只是想知道，我在他們心裡，還佔著多大一個位置。"},
{h:["你想要的，不只是輕鬆，也想他們記得你，是這樣嗎？","（眼眶泛紅）……對。我想他們想起我的時候，是想念，不是責任。我更想知道，我在他們心裡，還佔著多大一個位置。","看見"],
s:["你想被記得，是因為你很愛他們，對嗎？","……對。我只是不想說得太肉麻。我怕日子久了，他們就把我放下了。","看見"],
x:["他們當然會記得你，你想太多了。","（沉默）……我知道。可是我還是想聽他們說。"],
d:["你的子女都很孝順，一定會記得你。","安慰","（笑）……是啊，上個星期天，我兒子說，爸，你煮的魚，我們都想念。我就說，那你們常回來吃啊。他說，好，下次……"],
f:["你想對他們說的，其實就是一句：我想你們，對嗎？","（笑了，眼眶卻紅了）……對。我下個星期天，就跟他們說。魚我蒸好，他們愛來不來。"],
f2:["你想被記得，不是因為怕被忘記，是因為你想一直在他們心裡，對嗎？","……對。就是這樣。謝謝你聽我說，我好像不怕了。"],
sx:["你直接跟他們說，你想被記得。","……我說不出口。"],
p:["你說他們下次回來，我們說回你剛才說的：你怕被他們淡忘。","（點頭）……對。我只是不知道，他們什麼時候才會想起我。","他們有沒有回來吃過魚？","有時有，有時沒有。沒有的時候，我會把那條魚吃光，邊吃邊看新聞。","那種時候，你是什麼感覺？","（輕聲）……有點空。我怕有一天，他們提起我，只剩下一句「那個老頭」。","S5"],
g:"（輕聲）……清明重陽沒有人來，我是不是就沒有人記得了。"}]}),
(function(){var o=mk({n:"一張請柬",t:"午飯後，同事阿Ben拿著一張請柬走過來。",e:55,b:"阿Ben，三十八歲，普通上班族，收到中學同學會的邀請，決定不去。習慣嘻皮笑臉地擋住感受。你是他的同事朋友。",
Ly:["決定不去同學會，去了沒話聊","尷尬、格格不入、有點羨慕","覺得自己像個失敗者、什麼都不是；明明大家的起點都一樣","想被問近況，而不是比較；想念不用比的日子","想知道自己不用炫耀什麼，也是這群人的一份子"],
open:"同學會的請柬來了。我決定不去了。",
L:[
{f:["",""],s:["",""],x:["",""],d:["","安慰",""],f2:["",""],sx:["",""],g:"（嘻皮笑臉）……他們聊歐洲旅行、股市、新車、名錶，我一句都接不上。你問我最近麥當勞有什麼優惠，我就知道！"},
{f:["你說有點格格不入，是在哪一刻，最明顯？","就是……他們輪流問「你最近去哪裡玩」的時候。我說我去了麥當勞，大家都笑了，然後話題就轉走了。我覺得有點羨慕。我覺得自己像個失敗者，什麼都不是。"],
s:["手拿著手機扮很忙，其實心裡也不好受吧。","（笑）……還好啦。只是有時候回家路上，會覺得自己特別沒用。"],
x:["你不要老是和別人比較。","（嘻皮笑臉）我哪有比較！我只是每次回家，都要算一下，我一個月的薪水，夠不夠買他們新車的一個輪胎！"],
d:["你也有你的好，不要這樣想。","安慰","（笑了笑）……謝謝。可是回家路上，我還是會覺得自己特別沒用。"],
f2:["你說回家路上覺得自己沒用，那種時候，你會想到什麼？","我會想……他們都有旅行，有投資，有新車，我什麼都沒有。明明大家起點都一樣，我就像個失敗者，什麼都不是。"],
sx:["你下次去之前，先準備一些話題，例如看幾篇旅遊攻略。","（嘻皮笑臉）好主意！我可以說，我沒去過，但我能背出每個景點的門票價格！"],
g:"（笑容淡了）……回家路上，我會覺得自己特別沒用。"},
{f:["你說自己像個失敗者，什麼都不是，在你心裡，失敗者是怎樣的？","就是……沒有什麼好說的人。明明大家的起點都一樣，一起在操場上跑，一起考同一份試卷。怎麼走著走著，只有我什麼都不是？其實我很想念，以前大家什麼都不用比的日子。"],
s:["大家起點一樣，卻只有自己好像落在後面，心裡一定很不是滋味。","（笑）……也沒有啦。只是有時候會想，如果我什麼都不是，我還有什麼值得他們記得。"],
x:["你怎麼會是失敗者？你也很好啊。","（嘻皮笑臉）謝謝！你這樣說，我更覺得自己是失敗者。普通到連請柬都寫錯我的名字，哈哈！","否定"],
d:["那些同學也沒什麼了不起，只會炫耀。","附和","也不是……他們真的過得很好。只是我有時候會想，如果我什麼都不是，我還有什麼值得他們記得。"],
f2:["如果同學會不用聊旅行和股市，你會想去嗎？","（想了想）……會吧。我其實很想念，以前大家什麼都不用比的日子。"],
sx:["你可以去旅行一次，下次就有話聊了。","（嘻皮笑臉）對！我下個月去，旅行團，七天，我要拍一千張照片，一張一張講給他們聽！"],
g:"（笑容淡了）……如果我什麼都不是，我還有什麼值得他們記得。"},
{f:["如果有那樣的聚會，你會希望大家怎樣對你？","我希望……有人問我，最近過得好不好，而不是問我去了哪裡玩、投資賺了多少。哪怕只是一句，我就會覺得自己還在這個圈子裡。"],

x:["同學會是自己去創造氣氛的，不要等別人。","（嘻皮笑臉）創造氣氛？我只是個路人甲，霞姐，我的飯盒呢？"],

f2:["你想被當成老同學，而不是比較的對象。","對……就是這樣。我不用有什麼可以炫耀的，還算不算是他們的同學。","反映"],

g:"（輕輕點頭）……我只是想知道，我不用有什麼可以炫耀的，還算不算是他們的同學。"},
{f:["你想知道，就算沒有什麼可以炫耀，你還是他們的同學，對嗎？","（笑容慢慢收起）……對。我想相信，我不用站在人群外面，也可以是這群人的一份子。"],
x:["你不需要別人的認可，做自己就好。","（嘻皮笑臉）做自己？做自己的結果，最後不就只剩下自己了！"],

mkh({n:"不會好好說話的爸爸",t:"週末晚上，阿欣約你出來，說了很多。",e:85,b:"阿欣，三十歲，與爸爸同住。爸爸習慣用責備表達關心。這一次，她說話會繞，會岔開，路徑也不止一條。你是她的好朋友。",
Ly:["又和爸爸吵架","火大、委屈、吵完後悔","覺得他不信任我，卻知道他擔心","想聽他好好說一句關心的話","想和爸爸用舒服的方式，把愛說出來"],
open:"我又和我爸吵架了。說起來也沒什麼大不了，他那個人，說話永遠都像在罵人。",
L:[
{h:["又吵架了，你這幾天心裡一定不好受吧。","（擺擺手）……還好啦，吵多了就習慣了。反正他就是那樣。那天我加班到十一點，他一開門就說：「這麼晚才回來，是不是又在外面亂跑？」我真的很火大。","同理"],
s:["你說他永遠像在罵人，那天是怎樣的？","那天我加班到十一點，他一開門就說：「這麼晚才回來，是不是又在外面亂跑？」我真的很火大。","邀請"],
x:["你就別理他，各過各的算了。","說得容易，我們住在一起啊。","建議"],
d:["你爸爸真的很過分！","附和","對吧！何止他，每個人都為難我。以為我好欺負，常常借著小事就數落我。就像我們公司那個上司，天天站在我桌旁問報告什麼時候交，好像我整天都在偷懶……"],
f:["被他這樣問，你當時是什麼心情？","我當時真的很火大，可是吵完又覺得很累，也有點後悔。"],
f2:["加班到那麼晚，回家還要被盤問，換了誰都會很委屈。","就是！我只是加班，又不是去玩。吵完我又覺得很累，也有點後悔。","同理"],
sx:["他可能只是擔心你，你誤會他了。","（冷笑）……你也是幫他說話。","否定"],
qa:["你爸爸平時是個怎樣的人？","他嘛……話很少，做了一輩子司機，回到家就坐在那裡看新聞。其實我知道，他每次都等我回家才睡。"],
q2:["他等你回家才睡，你知道的時候，是什麼感覺？","……心裡很亂。我知道他是擔心我，可是每次他一開口就變了味。我當時真的很火大，可是吵完又覺得很累，也有點後悔。"],
q3:["聽起來，你很了解他，也沒有很討厭他。","（輕聲）……他就是那樣。那天我加班到十一點，他一開門就說：「這麼晚才回來，是不是又在外面亂跑？」我真的很火大。"],
qx:["那你跟他說，你知道他等你。","（搖頭）……說不出口。"],
p:["你說上司也是這樣，跟你爸爸有點像。那你爸爸那天是怎樣說的？","（笑了笑）……對，說回來。那天我加班到十一點，他一開門就說：「這麼晚才回來，是不是又在外面亂跑？」我真的很火大。","你上司為什麼這樣針對你？","他說是為了效率，其實就是不信任我們。連去洗手間都要報備！","那你有跟他說過嗎？","（越說越起勁）……說過啊，他說：這是公司規定。你說有沒有道理……"],
g:"（沉默一下）……那天我加班到十一點，他一開門就說：「這麼晚才回來，是不是又在外面亂跑？」我真的很火大。"},
{h:["你說有點後悔，是後悔什麼呢？","（低頭）……後悔說了重話。其實也不是第一次了，我也不是故意頂嘴，就是控制不住。"],
s:["我聽得出你生氣，但也有點後悔。","對，就是這樣……我也不是故意頂嘴，就是控制不住，吵完心裡很亂。","反映"],
x:["下次忍一下，別頂嘴。","（皺眉）……你們都一樣，只會叫我怎樣怎樣。"],
d:["別想了，吵一次而已，過幾天就好。","安慰","（笑了笑）……對啊，過幾天就好了。說起來，我弟下個月結婚，到時候又要見一堆親戚，肯定又要被問東問西……"],
f:["那為什麼會控制不住呢？","因為他說得好像我在外面做壞事一樣……他根本不信任我，永遠把我當小孩。"],
f2:["吵完心裡很亂，是怎麼個亂法？","就是……又氣又難過，我也不知道自己想怎樣。其實我只是想他別再把我當小孩，他根本不信任我。"],
sx:["你可以直接跟他說，你想他怎麼說話。","（嘆氣）說了很多次了，沒用的。"],
qa:["你說控制不住，以前也是這樣嗎？","（想了想）……其實我小時候就是這樣。他一罵我，我就躲進房間，長大了，就變成頂嘴。"],
q2:["從躲進房間，到頂嘴，你好像一直想讓他知道你的感受。","……也許吧。我只是想他別再把我當小孩，他根本不信任我。"],
q3:["小時候被罵，躲進房間，那時候你心裡是怎樣的？","（輕聲）……很怕，也很委屈。我也不是故意頂嘴，就是控制不住。"],
qx:["小時候的事，你現在長大了，別再計較了。","（沉默）……我沒有計較。","說教"],
p:["你說到你弟結婚，我們先說回你爸爸吧。吵完心裡亂，是怎麼個亂法？","（嘆了口氣）……對，說回來。吵完我心裡很亂，我也不是故意頂嘴，就是控制不住。","你們兄弟姊妹感情好嗎？","還好啦，他在外面住，我們很少見面。他結婚那天，要我做伴娘……算了，不說了。","那天你會穿什麼？","（笑）……我還沒買衣服，每家店都貴得離譜，你說伴娘裙為什麼要賣這麼貴……"],
g:"（輕聲）……我也不是故意頂嘴，就是控制不住。"},
{h:["如果他換一種方式說，你希望他怎麼說？","（猶豫）……我也不知道。其實我知道他是擔心我，只是他每次說出口，就變了味。"],
s:["被當成小孩，一定很不甘心。","對……可是其實我知道他是擔心我，只是他每次說出口，就變了味。"],
x:["他可能只是關心你，你誤會他了。","（冷笑）……那我就是不懂事了？","否定"],
d:["他就是脾氣大，沒辦法。","附和","對啊，連我們家的貓都怕他。上次他一回來，貓就躲進沙發底下，三個小時都不出來……"],
f:["你說知道他是擔心你，那你聽到的，是什麼？","我聽到的，是他覺得我什麼都做不好。我希望他將我當大人看，其實我都有能力照顧自己。"],
f2:["你明白他的心意，但聽到的卻不是關心，對嗎？","對！我要的就是他將我當大人看，其實我都有能力照顧自己。","反映"],
sx:["那你可以直接告訴他，你知道他擔心。","我哪說得出口……"],
qa:["那他是怎樣表達擔心的？除了說話之外。","（想了想）……他會在我桌上留一碗湯，不說是給我的。我吃完，他就假裝沒看見。"],
q2:["一碗湯，他不說，你卻明白。你更希望他怎樣？","我希望他將我當大人看，其實我都有能力照顧自己。"],
q3:["他用湯代替說話，你收到的時候，是什麼感覺？","（輕聲）……有點暖，也有點氣。其實我知道他是擔心我，只是他每次說出口，就變了味。"],
qx:["那你也留一碗湯給他，不就扯平了？","（笑了一下）……他才不會明白。"],
p:["說回你爸爸吧。你剛才說，你知道他是擔心你。","（笑了笑）……好，說回來。其實我知道他是擔心我，只是他每次說出口，就變了味。","貓後來出來了嗎？","出來了，還在他的拖鞋裡睡著了。我爸看見，也沒趕牠，只是站在那裡看了很久。","你爸爸看著貓的時候，是什麼樣子？","（輕聲）……很溫柔。他對貓說話的語氣，比對我好多了。其實我知道他是擔心我，只是他每次說出口，就變了味。","S3"],
g:"（輕聲）……其實我知道他是擔心我，只是他每次說出口，就變了味。"},

s:["你想他把你當大人看。","對……我有能力照顧自己，只是想他知道。只要他好好說一句，我就不會頂嘴了。","重複"],

s:["你想要的，是跟爸爸用舒服的方式，把這份愛說出來，對嗎？","對。我想有一天，我們可以自然地說出來。我想他知道，我也愛他。","看見"],
